<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentManager</title>
<style>
  :root {
    --bg: #101216;
    --col-bg: #15181d;
    --card: #1d2229;
    --card-hover: #262c35;
    --text: #e8eaed;
    --dim: #9aa0a8;
    --working: #4ade80;
    --needs: #fbbf24;
    --idle: #6b7280;
    --stalled: #f87171;
    --line: #2a2f37;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 20px;
    background: var(--bg); color: var(--text);
    font: 14.5px/1.45 -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; gap: 16px;
  }
  header { display: flex; align-items: baseline; gap: 14px; flex: none; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  #summary { color: var(--dim); font-size: 13px; }
  #board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    flex: 1; min-height: 0;
  }
  .col {
    background: var(--col-bg); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }
  .cards, .card { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 9px;
    padding: 13px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .col-head .dot { width: 10px; height: 10px; border-radius: 50%; }
  .col-head .name { font-weight: 700; font-size: 13.5px; letter-spacing: .6px; text-transform: uppercase; }
  .col-head .count {
    margin-left: auto; background: #262b33; border-radius: 999px;
    padding: 1px 10px; font-size: 12.5px; color: var(--dim);
  }
  .col-head .dot.pulsing { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .cards { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; cursor: pointer; transition: background .12s, transform .12s;
    border-left-width: 3px;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:active { transform: translateY(0); }
  .card.stalled { border-left-color: var(--stalled) !important; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; gap: 7px; margin-top: 6px; color: var(--dim); font-size: 12px; flex-wrap: wrap; align-items: center; }
  .chip { background: #262b33; border-radius: 6px; padding: 1px 7px; }
  .flag { font-weight: 600; }
  .flag.ask { color: var(--needs); }
  .flag.plan { color: #c4b5fd; }
  .flag.changes { color: #f87171; }
  .flag.stalled { color: var(--stalled); }
  .chip.stage { text-transform: capitalize; }
  .chip.stage.planning { background: #2a2440; color: #c4b5fd; }
  .chip.stage.implementing { background: #1f3325; color: #86e0a3; }
  .chip.stage.review { background: #3a3320; color: #fcd34d; }
  .chip.stage.done { background: #262b33; color: #8b929c; }
  .pr { border-radius: 6px; padding: 1px 7px; background: #262b33; color: #9aa3af; }
  .pr.changes { background: #3a2222; color: #f87171; border: 1px solid #5c2f2f; font-weight: 600; }
  .pr.draft { opacity: 0.65; }
  .activity {
    margin-top: 7px; color: var(--dim); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .agents { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
  .agent {
    font-size: 11.5px; background: #1f3325; color: #86e0a3;
    border: 1px solid #2c4a35; border-radius: 6px; padding: 2px 8px;
  }
  .col.compact .card { padding: 9px 14px; }
  .col.compact .activity, .col.compact .agents { display: none; }
  .empty-col { color: #4a505a; text-align: center; padding: 26px 0 14px; font-size: 13px; }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #2b313a; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 16px; font-size: 13.5px; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 900px) { #board { grid-template-columns: 1fr !important; } .col { min-height: 120px; } }
</style>
</head>
<body>
<header>
  <h1>AgentManager</h1>
  <div id="summary">loading…</div>
</header>
<div id="board"></div>
<div id="toast"></div>
<script>
const board = document.getElementById("board");
const summary = document.getElementById("summary");
const toast = document.getElementById("toast");
let toastTimer;
let builtColumns = "";

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function ago(sec) {
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m`;
  return `${Math.floor(sec / 3600)}h ${Math.floor((sec % 3600) / 60)}m`;
}

function esc(t) {
  const d = document.createElement("div");
  d.textContent = t ?? "";
  return d.innerHTML;
}

async function focus(id, title) {
  try {
    const r = await fetch(`/api/focus/${id}`, { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    showToast(`Focused: ${title}`);
  } catch (e) {
    showToast(`Focus failed: ${e.message}`);
  }
}

function prBadge(pr) {
  if (!pr || pr.number === null) return "";
  const changes = pr.reviewDecision === "CHANGES_REQUESTED";
  const cls = `pr${changes ? " changes" : ""}${pr.isDraft ? " draft" : ""}`;
  const suffix = changes ? " changes" : pr.isDraft ? " draft" : "";
  return `<span class="${cls}" title="${esc(pr.url ?? "")}">#${esc(String(pr.number))}${suffix}</span>`;
}

function cardHtml(s, color) {
  const flags = [];
  if (s.blockedOn === "question") flags.push('<span class="flag ask">question waiting</span>');
  if (s.blockedOn === "plan") flags.push('<span class="flag plan">plan approval</span>');
  if (s.blockedOn === "changes-requested") flags.push('<span class="flag changes">changes requested</span>');
  if (s.stalled) flags.push('<span class="flag stalled">stalled?</span>');
  return `
  <div class="card${s.stalled ? " stalled" : ""}" style="border-left-color:${color}"
       data-id="${s.id}" data-title="${esc(s.title)}">
    <div class="title" title="${esc(s.title)}">${esc(s.title)}</div>
    <div class="meta">
      ${s.project?.name ? `<span class="chip">${esc(s.project.name)}</span>` : ""}
      ${s.stage ? `<span class="chip stage ${s.stage}">${esc(s.stage)}</span>` : ""}
      ${prBadge(s.pr)}
      ${s.model ? `<span class="chip">${esc(s.model.replace("claude-", ""))}</span>` : ""}
      <span>${ago(s.ageSeconds)}</span>
      ${flags.join("")}
    </div>
    ${s.lastActivity ? `<div class="activity">${esc(s.lastActivity)}</div>` : ""}
    ${s.agents.length ? `<div class="agents">${s.agents.map(a =>
      `<span class="agent">⚙ ${esc(a.label)}</span>`).join("")}</div>` : ""}
  </div>`;
}

function buildColumns(cols) {
  board.style.gridTemplateColumns = `repeat(${cols.length}, 1fr)`;
  board.innerHTML = cols.map(c => `
    <div class="col${c.compact ? " compact" : ""}" id="colwrap-${c.id}">
      <div class="col-head">
        <span class="dot${c.compact ? "" : " pulsing"}" style="background:${c.color}"></span>
        <span class="name" style="color:${c.color}">${esc(c.label)}</span>
        <span class="count" id="count-${c.id}">0</span>
      </div>
      <div class="cards" id="col-${c.id}"></div>
    </div>`).join("");
}

function render(data) {
  const cols = data.columns ?? [];
  const key = JSON.stringify(cols);
  if (key !== builtColumns) { buildColumns(cols); builtColumns = key; }

  const byCol = Object.fromEntries(cols.map(c => [c.id, []]));
  for (const s of data.sessions) (byCol[s.state] ?? byCol[cols.at(-1)?.id])?.push(s);

  summary.textContent = cols.map(c => `${byCol[c.id].length} ${c.label.toLowerCase()}`).join(" · ");
  const attention = cols.length > 1 ? byCol[cols[1].id].length : 0;
  document.title = attention > 0 ? `(${attention}) AgentManager` : "AgentManager";

  for (const c of cols) {
    const el = document.getElementById(`col-${c.id}`);
    document.getElementById(`count-${c.id}`).textContent = byCol[c.id].length;
    el.innerHTML = byCol[c.id].length
      ? byCol[c.id].map(s => cardHtml(s, s.attentionColor ?? c.color)).join("")
      : `<div class="empty-col">—</div>`;
    for (const card of el.querySelectorAll(".card")) {
      card.addEventListener("click", () => focus(card.dataset.id, card.dataset.title));
    }
  }
}

async function poll() {
  try {
    const r = await fetch("/api/sessions");
    render(await r.json());
  } catch {
    summary.textContent = "daemon unreachable";
  }
}
poll();
setInterval(poll, 2500);
</script>
</body>
</html>
